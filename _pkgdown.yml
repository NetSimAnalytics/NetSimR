url: https://netsimanalytics.github.io/NetSimR/

template:
  bootstrap: 5
  # the picture of a link shared on LinkedIn, Teams, Slack and the like (pkgdown/assets/card.png);
  # the logo is man/figures/logo.png and the browser's icons are in pkgdown/favicon
  opengraph:
    image:
      src: card.png
      alt: "NetSimR: free actuarial tools for non-life insurance. Pricing, reserving, reinsurance and capital, in R or in your browser."
  params:
    # Google Search Console's proof that the site is ours (it is public in every page)
    google_site_verification: AKlPkBAn-vsvVKpt5cN47ZEQHXtdrM5_FtSX6NEI0Dc
  # page views, counted by GoatCounter without cookies or personal data
  # (https://netsimanalytics.goatcounter.com); the browser tools get the same script from
  # pkgdown/shinylive-apps.R
  includes:
    in_header: |
      <script data-goatcounter="https://netsimanalytics.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
      <meta name="twitter:card" content="summary_large_image">

home:
  # the home page's tab and link previews; pkgdown appends " • NetSimR", which the
  # workflow drops from this one page (it already starts with the name)
  title: "NetSimR: free actuarial tools for non-life insurance"
  description: >-
    Free, open-source R package and browser tools for non-life insurance pricing,
    reserving, reinsurance and capital modelling. Your data stays on your computer.
  links:
  - text: Try the Shiny apps in your browser
    href: https://netsimanalytics.github.io/NetSimR/articles/try-online.html
  - text: Custom tools for insurers and reinsurers
    href: https://netsimanalytics.github.io/NetSimR/articles/custom-tools.html

navbar:
  structure:
    left: [intro, tryonline, reference, articles, news, customtools]
    right: [search, github]
  components:
    tryonline:
      text: Try online
      icon: fa-play
      href: articles/try-online.html
    customtools:
      text: Custom tools
      icon: fa-handshake
      href: articles/custom-tools.html

reference:
- title: Shiny tools
  desc: Applications that run the package's models without writing code.
  contents:
  - run_shiny_simulator
  - run_shiny_distribution_fitting_tool
  - run_shiny_glm_fitting_tool
  - run_shiny_reserving_tool
  - run_shiny_reinsurance_pricing_tool
  - run_shiny_portfolio_tool
- title: Claims simulation and reinsurance
  desc: Frequency-severity simulation with Pareto tails, caps and layers, and portfolios of lines joined by a copula.
  contents:
  - simulate_claims
  - simulate_function
  - simulate_portfolio
  - apply_deductible_limit
  - reinstatement_premium
  - compare_reinsurance
- title: Claims reserving
  desc: Chain ladder with Mack's standard errors, methods with premiums, the bootstrap, the one-year view, the Munich chain ladder, Clark's growth curves, inflation and actual vs expected.
  contents:
  - chain_ladder
  - bornhuetter_ferguson
  - cape_cod
  - bootstrap_chain_ladder
  - merz_wuthrich
  - munich_chain_ladder
  - actual_vs_expected
  - clark_growth
  - inflation_adjusted_chain_ladder
  - as_triangle
- title: IFRS 17 and Solvency II
  desc: Discounted reserves, the risk adjustment, and the standard formula's non-life premium and reserve risk.
  contents:
  - discount_reserves
  - risk_adjustment
  - sii_premium_reserve_risk
  - sii_nonlife_segments
- title: Excess of loss pricing
  desc: Burning cost, Pareto rating, exposure rating with MBBEFD curves or a claim size distribution, and the technical premium.
  contents:
  - burning_cost
  - pareto_rating
  - property_exposure_rating
  - mbbefd_curve
  - technical_premium
  - credibility_weight
- title: Pricing models and rate reviews
  desc: A Tweedie family for generalised linear models of the loss cost, on-level premiums, the indicated rate change and Buhlmann-Straub credibility.
  contents:
  - tweedie_family
  - on_level_premium
  - indicated_rate_change
  - buhlmann_straub
- title: Capped means
  contents:
  - GammaCappedMean
  - LNormCappedMean
  - ParetoCappedMean
  - ParetoCappedMeanCalc
  - SlicedGammaParetoCappedMean
  - SlicedLNormParetoCappedMean
- title: Exposure curves and increased limit factors
  contents:
  - starts_with("ExposureCurve")
  - starts_with("ILF")
- title: Sliced distributions
  desc: LogNormal or Gamma bodies with a Pareto tail.
  contents:
  - SlicedGammaParetoMean
  - SlicedLNormParetoMean
  - dSlicedGammaPareto
  - pSlicedGammaPareto
  - qSlicedGammaPareto
  - dSlicedLNormPareto
  - pSlicedLNormPareto
  - qSlicedLNormPareto
- title: Pure IBNR and unearned premium
  contents:
  - PureIBNRGamma
  - PureIBNRLNorm
- title: Special functions
  contents:
  - IGamma
  - erf
- title: Data sets
  contents:
  - raa_triangle
  - taylor_ashe_triangle
  - quarg_mack
  - simulated_motor_claims
  - xl_large_losses
  - xl_premium
  - xl_property_profile
  - xl_casualty_profile
  - motor_policies
  - liability_claims

articles:
- title: Articles
  navbar: ~
  contents:
  - EndToEnd
  - PricingMonitoring
  - SimulateClaims
  - Reserving
  - ReinsurancePricing
  - CappedMean
  - SlicedDistributions
  - PureIBNR
- title: Shiny tools
  navbar: Shiny tools
  contents:
  - articles/try-online
  - articles/worked-example
- title: Custom tools
  navbar: Custom tools
  contents:
  - articles/custom-tools
