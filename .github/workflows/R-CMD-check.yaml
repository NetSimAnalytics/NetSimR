# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
  # a "Run workflow" button on the Actions tab, to run the check without a new commit
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

# a new push cancels the run still going for the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          # the browser tests (tests/testthat/test-app-*.R) run on this job only: they add a few
          # minutes and depend on timing, and the apps' behaviour does not differ by platform
          - {os: ubuntu-latest,  r: 'release', browser-tests: 'true'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # the database drivers in Suggests are optional; the check should not fail if one cannot be installed
      _R_CHECK_FORCE_SUGGESTS_: false
      NETSIMR_BROWSER_TESTS: ${{ matrix.config.browser-tests || 'false' }}

    steps:
      - uses: actions/checkout@v5

      # roxygen2 reads an indented #' comment inside a function as part of the function's
      # documentation block (it once broke NAMESPACE and dropped help-page examples)
      - name: No roxygen comments inside functions
        shell: bash
        run: |
          if grep -nE "^[[:space:]]+#'" R/*.R; then
            echo "::error title=Indented roxygen comment::A comment inside a function starts with #' (listed above); start it with # instead."
            exit 1
          fi

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # CRAN's macOS binaries are now a mix of xz- and zstd-compressed .tgz files, and the pak
      # that setup-r-dependencies installs with cannot read the zstd ones ("Cannot extract ...,
      # unknown archive type", r-lib/pkgdepends#485). Base R's own installer reads them, so this
      # job installs its dependencies with it; put the step back when that issue is closed.
      - name: Install dependencies with base R (macOS)
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_deps(dependencies = TRUE)

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: runner.os != 'macOS'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      # job logs need admin rights to download, but annotations are public: show the
      # problems of a failed check as annotations on the run
      - name: Show check problems as annotations
        if: failure()
        shell: Rscript {0}
        run: |
          esc <- function(x) gsub("\n", "%0A", gsub("\r", "%0D", gsub("%", "%25", x, fixed = TRUE), fixed = TRUE), fixed = TRUE)
          note <- function(title, text) {
            text <- paste(text, collapse = "\n")
            if (nchar(text) > 3500) text <- paste0("...\n", substring(text, nchar(text) - 3500))
            cat("::error title=", title, "::", esc(text), "\n", sep = "")
          }
          dirs <- list.files("check", pattern = "[.]Rcheck$", full.names = TRUE)
          if (!length(dirs)) quit(save = "no")
          log <- readLines(file.path(dirs[1], "00check.log"), warn = FALSE)
          starts <- grep("[.][.][.] .*(ERROR|WARNING)$", log)
          for (s in head(starts, 6)) {
            nxt <- grep("^[*] ", log)
            e <- min(c(nxt[nxt > s], length(log) + 1)) - 1
            note(log[s], log[s:e])
          }
          for (f in list.files(file.path(dirs[1], "tests"), pattern = "[.]Rout[.]fail$", full.names = TRUE)) {
            note(basename(f), tail(readLines(f, warn = FALSE), 80))
          }
