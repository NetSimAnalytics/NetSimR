# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Builds the package website with pkgdown and publishes it to the gh-pages branch, which
# GitHub Pages serves at https://netsimanalytics.github.io/NetSimR/. With the site go the six
# Shiny tools, exported with shinylive to run in the browser (apps/), a WebAssembly build of
# the package for webR, from which they install it (wasm/), and the reports of the worked
# example (reports/).
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # only one run at a time publishes the site
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., github::posit-dev/r-shinylive
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # the home page's title starts with the package's name, so pkgdown's " • NetSimR" is dropped
      - name: Shorten the home page's title
        run: |
          sed -i 's|^<title>\(NetSimR: .*\) • NetSimR</title>|<title>\1</title>|' docs/index.html
          grep -o '<title>[^<]*</title>' docs/index.html

      # the reports of the worked example (vignettes/articles/worked-example.Rmd), written by
      # the tools themselves
      - name: Write the worked example's reports
        run: Rscript pkgdown/example-reports.R docs/reports

      # the tools for the browser; they install NetSimR from the WebAssembly repository below
      - name: Export the tools for the browser
        if: github.event_name != 'pull_request'
        run: Rscript pkgdown/shinylive-apps.R docs/apps https://netsimanalytics.github.io/NetSimR/wasm

      # a repository of the package built for webR (its dependencies come from webR's own); the
      # step runs in Docker, and its files cannot be changed by later steps
      - name: Build the package for WebAssembly
        if: github.event_name != 'pull_request'
        uses: r-wasm/actions/build-rwasm@v3
        with:
          packages: "."
          repo-path: "docs/wasm"
          image-path: "wasm-image"

      # pull requests build the site to check it, without publishing it
      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
